# Prometheus 抓取配置示例（放在监控机上）
# 后端容器不对外暴露 8081，监控机需与 compose 网络互通，或经宿主机内网地址抓取
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/yanjie-rules.yml

scrape_configs:
  - job_name: yanjie-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8081        # 与 docker-compose.prod.yml 同网络时
          # - 10.0.0.12:8081   # 或宿主机内网地址
