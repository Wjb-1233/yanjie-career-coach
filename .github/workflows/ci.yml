name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 运行测试
        env:
          ENVIRONMENT: test
        run: pytest -q

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx vue-tsc -b --force

      - name: 构建
        run: npm run build

  deploy-config:
    name: 部署配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验生产 compose
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example config -q

      - name: 校验 nginx 配置
        run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: 校验冒烟脚本可执行
        run: python3 -m py_compile scripts/smoke_test.py

  e2e:
    name: 浏览器端到端
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装后端依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动后端（SQLite，无需模型 Key）
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
          AUTO_CREATE_SCHEMA: "true"
          REDIS_ENABLED: "false"
          MILVUS_ENABLED: "false"
          LLM_API_KEY: ""
          JWT_SECRET: e2e-only-secret-longer-than-32-characters
          CORS_ORIGINS: http://127.0.0.1:5173
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8081 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/api/v1/health > /dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "backend failed to start"
          tail -50 /tmp/backend.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: 启动前端
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then
              echo "frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "frontend failed to start"
          tail -50 /tmp/frontend.log
          exit 1

      - name: 运行端到端测试
        working-directory: frontend
        run: npx playwright test

      - name: 上传失败现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
  security:
    name: 依赖安全扫描（建议性）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 后端依赖漏洞扫描
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --desc on || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前端依赖漏洞扫描
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true
