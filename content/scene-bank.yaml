    dimension: null
    difficulty: null
  - text: 你了解我们公司和这个岗位的哪些情况，这些跟你自己的兴趣和能做的事是怎么对上的？
    dimension: null
    difficulty: null
- id: scene-general-start-date
  category: HR 初面
  title: 最早到岗时间怎么谈
  difficulty: 中级
  roleName: 招聘 HR
  background: 企业希望尽快确定入职日期，但候选人还要完成毕业手续、当前工作交接或其他已确定安排。
  goal: 给出真实可执行的最早到岗日期、需要完成的事项和可协调空间，不做无法兑现的承诺。
  openingLine: 如果我们决定录用你，你最早什么时候可以到岗？能不能再提前一些？
  tags:
  - 到岗时间
  - 入职安排
  - 预期管理
  questions:
  - text: 先简单介绍一下你自己，重点说说和这个岗位相关的经历吧？
    dimension: null
    difficulty: null
  - text: 你最早能什么时候到岗？还有哪些事得先处理完，时间上有没有协调余地？
    dimension: null
    difficulty: null
- id: scene-interview-15
  category: HRBP/HR 终面
  title: 多份录用机会中的薪资协商
  difficulty: 进阶
  roleName: 招聘经理
  background: 候选人同时在考虑两份录用机会，希望和更心仪的企业讨论薪酬与成长条件。
  goal: 如实表达意向和关注点，提出具体问题或请求，不虚构其他 offer 施压。
  openingLine: 我们已经给出正式 offer，你还有哪些条件需要讨论？
  tags:
  - 录用选择
  - 条件协商
  - 诚信沟通
  questions:
  - text: 先简单介绍一下自己，也说说你为什么对我们这个机会更心动吧？
    dimension: null
    difficulty: null
  - text: 你手上还有别的机会，你会怎么跟我们聊薪资和成长条件，又不把话说得太虚？
    dimension: null
    difficulty: null
- id: scene-general-overtime
  category: HRBP/HR 终面
  title: 如何回应加班安排
  difficulty: 进阶
  roleName: 招聘经理
  background: 面试官表示岗位可能经常加班，并提出加班没有额外补贴，观察候选人如何确认条件与表达边界。
  goal: 保持礼貌，先确认工作时长、安排与补偿政策，再清楚表达自己的考虑和可接受范围；不仓促承诺。
  openingLine: 我们这个岗位经常需要加班，而且没有额外加班费，你能接受吗？
  tags:
  - 工作安排
  - 边界表达
  - 条件确认
  questions:
  - text: 先简单做个自我介绍，说说你为什么想投这个岗位吧？
    dimension: null
    difficulty: null
  - text: 如果这个岗位经常加班还没补贴，你会先问清楚哪些情况，又怎么说出自己的接受范围？
    dimension: null
    difficulty: null
