- id: scene-interview-06
  category: HR 初面
  title: 一次没有达到目标的项目复盘
  difficulty: 入门
  roleName: 校招面试官
  background: 面试官想了解候选人面对失败时是否能承担责任、识别原因并改进，而不是只归因于外部条件。
  goal: 用真实经历说明目标、偏差、自己的责任、采取的补救行动以及学到的经验。
