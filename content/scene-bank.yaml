  - text: 讲一次你没达到目标的事，当时差在哪、你自己做了什么补救，后来又学到什么？
    dimension: null
    difficulty: null
- id: scene-general-motivation
  category: HR 初面
  title: 为什么选择我们公司
  difficulty: 入门
  roleName: 招聘 HR
  background: 招聘 HR 想了解候选人对公司与岗位的认识，以及个人选择是否经过认真考虑。
  goal: 把了解过的公司与岗位事实、个人兴趣和可贡献之处连起来，不说空泛套话或编造信息。
  openingLine: 你为什么选择我们公司，而不是其他类似的企业？
